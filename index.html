<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <!-- Díky tomuto řádku se stránka správně přizpůsobí šířce mobilu -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16a34a">
  <title>Jídelníček – BMI kalkulačka</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Jídelníček</h1>
      <p class="subtitle">BMI kalkulačka</p>
    </header>

    <section class="card">
      <form id="bmi-form" novalidate>
        <div class="field">
          <label for="height">Výška</label>
          <div class="input-wrap">
            <input id="height" name="height" type="number" inputmode="decimal"
                   min="50" max="250" step="any" placeholder="např. 175" required>
            <span class="unit">cm</span>
          </div>
        </div>

        <div class="field">
          <label for="weight">Váha</label>
          <div class="input-wrap">
            <input id="weight" name="weight" type="number" inputmode="decimal"
                   min="20" max="300" step="any" placeholder="např. 70" required>
            <span class="unit">kg</span>
          </div>
        </div>

        <p id="error" class="error" role="alert" hidden></p>

        <button type="submit" class="button">Spočítat</button>
      </form>
    </section>

    <!-- Výsledek je na začátku skrytý, zobrazí se až po výpočtu -->
    <section id="result" class="card result" aria-live="polite" hidden>
      <p class="result-label">Vaše BMI</p>
      <p id="bmi-value" class="bmi-value">–</p>
      <p id="bmi-category" class="badge">–</p>
      <p id="bmi-text" class="result-text"></p>
    </section>

    <p class="note">
      BMI je jen orientační ukazatel. Nezohledňuje svaly, věk ani pohlaví.
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
